<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Blackpool - Off-Grid Cabin Dashboard</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(30, 41, 59, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e2e8f0;
    }

    .badge {
      font-size: 0.8rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card h3 {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-sub);
    }

    .metric-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .metric-card .unit {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-sub);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }

    .chart-card h3 {
      margin: 0 0 16px 0;
      font-size: 1rem;
      color: #e2e8f0;
    }

    canvas {
      width: 100% !important;
      max-height: 280px;
    }
  </style>
</head>
<body>

  <header>
    <h1>PROJECT BLACKPOOL TELEMETRY</h1>
    <div id="status-tag" class="badge">Live | Syncing...</div>
  </header>

  <!-- Key Metric Summary Cards -->
  <div class="metrics-grid">
    <div class="glass-card metric-card">
      <h3>Starlink Status</h3>
      <div class="value" id="val-starlink-status">--</div>
      <div class="unit" id="val-starlink-age">Checking link...</div>
    </div>
    <div class="glass-card metric-card">
      <h3>Outdoor Temp</h3>
      <div class="value"><span id="val-outdoor">--</span> <span class="unit">°C</span></div>
    </div>
    <div class="glass-card metric-card">
      <h3>Humidity</h3>
      <div class="value"><span id="val-humidity">--</span> <span class="unit">%</span></div>
    </div>
    <div class="glass-card metric-card">
      <h3>Battery Voltage</h3>
      <div class="value"><span id="val-voltage">--</span> <span class="unit">V</span></div>
    </div>
    <div class="glass-card metric-card">
      <h3>System Power</h3>
      <div class="value"><span id="val-power">--</span> <span class="unit">W</span></div>
    </div>
  </div>

  <!-- Dynamic Glass Charts -->
  <div class="charts-grid">
    <div class="glass-card chart-card">
      <h3>Temperature & Weather Trends</h3>
      <canvas id="tempChart"></canvas>
    </div>
    <div class="glass-card chart-card">
      <h3>Battery & Power System Health</h3>
      <canvas id="powerChart"></canvas>
    </div>
  </div>

  <script>
    // --- PRIVATE CHANNEL CREDENTIALS ---
    // Primary Weather Channel Details
    const WEATHER_CHANNEL_ID = '2120294';
    const WEATHER_READ_KEY = 'PQID62S8NLN4FQRO';

    // Secondary Solar / Power Channel Details (Update these once Channel 2 is configured)
    const SOLAR_CHANNEL_ID = '3538691'; 
    const SOLAR_READ_KEY = 'S93NC07W9VKUDCLL';

    let tempChart, powerChart;

    async function fetchTelemetry() {
      try {
        // Query Primary Weather Channel Feed
        const weatherUrl = `https://api.thingspeak.com/channels/${WEATHER_CHANNEL_ID}/feeds.json?api_key=${WEATHER_READ_KEY}&results=30`;
        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();
        const weatherFeeds = weatherData.feeds;
        const latestWeather = weatherFeeds[weatherFeeds.length - 1];

        // Evaluate Starlink Link Status via Feed Timestamp Age
        checkStarlinkHealth(latestWeather.created_at);

        // Update Weather Stat Cards
        document.getElementById('val-outdoor').innerText = parseFloat(latestWeather.field7 || 0).toFixed(1);
        document.getElementById('val-humidity').innerText = parseFloat(latestWeather.field2 || 0).toFixed(1);

        // Query Solar Channel Feed (If initialized)
        let solarFeeds = [];
        let latestSolar = {};
        if (SOLAR_CHANNEL_ID !== 'YOUR_SOLAR_CHANNEL_ID') {
          const solarUrl = `https://api.thingspeak.com/channels/${SOLAR_CHANNEL_ID}/feeds.json?api_key=${SOLAR_READ_KEY}&results=30`;
          const solarRes = await fetch(solarUrl);
          const solarData = await solarRes.json();
          solarFeeds = solarData.feeds;
          latestSolar = solarFeeds[solarFeeds.length - 1] || {};

          document.getElementById('val-voltage').innerText = parseFloat(latestSolar.field1 || 0).toFixed(2);
          document.getElementById('val-power').innerText = parseFloat(latestSolar.field4 || 0).toFixed(1);
        }

        // --- EXTRACT TIMESTAMP & VERSION NUMBER FROM FIELD 8 ---
        const payloadTimestamp = latestWeather.field8 || ''; 
        const versionMatch = payloadTimestamp.match(/\(v[\d\.]+\)/);
        const versionStr = versionMatch ? `| ${versionMatch[0]}` : '';

        const timeStr = new Date(latestWeather.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        // Update header badge with time and active firmware version
        document.getElementById('status-tag').innerText = `Live | Updated ${timeStr} ${versionStr}`;

        // Parse Weather Feeds into Arrays
        const labels = weatherFeeds.map(f => new Date(f.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        const outdoorTemps = weatherFeeds.map(f => parseFloat(f.field7));
        const indoorTemps = weatherFeeds.map(f => parseFloat(f.field1));

        // Parse Solar Arrays with Fallback Protection
        const batteryVolts = labels.map((_, index) => {
          return (solarFeeds[index] && solarFeeds[index].field1) ? parseFloat(solarFeeds[index].field1) : null;
        });
        const systemWatts = labels.map((_, index) => {
          return (solarFeeds[index] && solarFeeds[index].field4) ? parseFloat(solarFeeds[index].field4) : null;
        });

        renderCharts(labels, outdoorTemps, indoorTemps, batteryVolts, systemWatts);
      } catch (err) {
        console.error('Telemetry fetch error:', err);
        document.getElementById('status-tag').innerText = 'Offline';
        document.getElementById('status-tag').style.borderColor = 'rgba(239, 68, 68, 0.4)';
        document.getElementById('status-tag').style.color = '#ef4444';

        document.getElementById('val-starlink-status').innerText = 'UNKNOWN';
        document.getElementById('val-starlink-status').style.color = '#ef4444';
        document.getElementById('val-starlink-age').innerText = 'Fetch Failed';
      }
    }

    function checkStarlinkHealth(latestTimestamp) {
      const lastUpdate = new Date(latestTimestamp);
      const now = new Date();
      const diffMinutes = Math.floor((now - lastUpdate) / 60000);

      const statusElem = document.getElementById('val-starlink-status');
      const ageElem = document.getElementById('val-starlink-age');

      if (diffMinutes <= 0) {
        ageElem.innerText = 'Just now';
      } else {
        ageElem.innerText = `Last seen ${diffMinutes}m ago`;
      }

      if (diffMinutes <= 3) {
        statusElem.innerText = 'ONLINE';
        statusElem.style.color = '#10b981'; // Green
      } else if (diffMinutes <= 10) {
        statusElem.innerText = 'DEGRADED';
        statusElem.style.color = '#f59e0b'; // Amber
      } else {
        statusElem.innerText = 'DOWN';
        statusElem.style.color = '#ef4444'; // Red
      }
    }

    function renderCharts(labels, outdoor, indoor, volts, watts) {
      const ctxTemp = document.getElementById('tempChart').getContext('2d');
      const ctxPower = document.getElementById('powerChart').getContext('2d');

      const gradCyan = ctxTemp.createLinearGradient(0, 0, 0, 300);
      gradCyan.addColorStop(0, 'rgba(6, 182, 212, 0.35)');
      gradCyan.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

      const gradPurple = ctxTemp.createLinearGradient(0, 0, 0, 300);
      gradPurple.addColorStop(0, 'rgba(168, 85, 247, 0.35)');
      gradPurple.addColorStop(1, 'rgba(168, 85, 247, 0.0)');

      const chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } }
        },
        plugins: {
          legend: { labels: { color: '#cbd5e1', font: { size: 12 } } }
        }
      };

      if (!tempChart) {
        tempChart = new Chart(ctxTemp, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: 'Outdoor Temp (°C)', data: outdoor, borderColor: '#06b6d4', backgroundColor: gradCyan, fill: true, tension: 0.4 },
              { label: 'Indoor Temp (°C)', data: indoor, borderColor: '#a855f7', backgroundColor: gradPurple, fill: true, tension: 0.4 }
            ]
          },
          options: chartOptions
        });

        powerChart = new Chart(ctxPower, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              { label: 'Battery Voltage (V)', data: volts, borderColor: '#10b981', borderWidth: 2, tension: 0.4, yAxisID: 'y', spanGaps: true },
              { label: 'System Power (W)', data: watts, borderColor: '#f59e0b', borderWidth: 2, tension: 0.4, yAxisID: 'y1', spanGaps: true }
            ]
          },
          options: {
            ...chartOptions,
            scales: {
              ...chartOptions.scales,
              y: { type: 'linear', display: true, position: 'left', ticks: { color: '#10b981' } },
              y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#f59e0b' } }
            }
          }
        });
      } else {
        tempChart.data.labels = labels;
        tempChart.data.datasets[0].data = outdoor;
        tempChart.data.datasets[1].data = indoor;
        tempChart.update();

        powerChart.data.labels = labels;
        powerChart.data.datasets[0].data = volts;
        powerChart.data.datasets[1].data = watts;
        powerChart.update();
      }
    }

    // Initial load and periodic refresh (every 60 seconds)
    fetchTelemetry();
    setInterval(fetchTelemetry, 60000);
  </script>
</body>
</html>
